<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; media-src 'self' https: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<title>N7 STUDIO — Independent Game Studio</title>
<meta name="description" content="N7 STUDIO is an independent game studio building worlds that linger after the screen goes dark.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — warm light theme, dark orange primary, light orange secondary
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fbf8f3;
  --bg-2:#f4ede2;
  --panel:#ffffff;
  --panel-2:#fdfaf6;
  --line:rgba(36,28,21,.09);
  --line-2:rgba(36,28,21,.17);
  --ink:#241c15;
  --ink-2:#4a4038;
  --muted:#7d7064;
  --muted-2:#a3968a;
  --gold:#c2571e;
  --gold-soft:#e8722f;
  --gold-dim:rgba(194,87,30,.18);
  --secondary:#ffd9b8;
  --secondary-soft:#fff1e4;
  --danger:#c9413a;
  --ok:#3f9a63;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.7,.24,1);
  --r-sm:6px;
  --r:10px;
  --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(60,40,20,.04);
  --shadow:0 18px 40px -24px rgba(70,45,20,.28);
  --shadow-lg:0 32px 70px -34px rgba(70,45,20,.32);
}
html[lang="ar"]{
  --serif:'Amiri','Cormorant Garamond',serif;
  --sans:'Tajawal','Inter',system-ui,sans-serif;
}
html[lang="ar"] *{letter-spacing:0 !important}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--secondary);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:#d9ccbd;border-radius:8px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:#c8b8a6}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 40px;transition:padding .35s var(--ease),background .35s var(--ease),border-color .35s;
  border-bottom:1px solid transparent;
}
.nav.solid{
  padding:13px 40px;background:rgba(251,248,243,.86);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom-color:var(--line);
}
.brand{display:flex;align-items:center;gap:13px;cursor:pointer}
.brand-mark{
  width:28px;height:28px;flex:0 0 auto;position:relative;
  border:1px solid var(--gold-dim);border-radius:6px;transform:rotate(45deg);
  display:grid;place-items:center;transition:.45s var(--ease);
}
.brand-mark::after{
  content:'';width:9px;height:9px;border-radius:2px;background:var(--gold);transition:.45s var(--ease);
}
.brand:hover .brand-mark{border-color:var(--gold);transform:rotate(135deg)}
.brand:hover .brand-mark::after{transform:rotate(-135deg) scale(.85)}
.brand-word{
  font-family:var(--serif);font-size:19px;letter-spacing:.24em;
  text-transform:uppercase;font-weight:600;color:var(--ink);
}
.brand-word small{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.32em;color:var(--muted-2);font-weight:400}
.nav-links{display:flex;align-items:center;gap:30px}
.nav-links a{
  position:relative;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);transition:color .25s;padding:4px 0;font-weight:500;
}
.nav-links a::after{
  content:'';position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);
  border-radius:2px;transition:width .3s var(--ease);
}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-cta{display:flex;align-items:center;gap:12px}

.lang-toggle{
  display:flex;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:100px;
  padding:8px 13px;cursor:pointer;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.08em;color:var(--muted);transition:.25s var(--ease);line-height:1;font-weight:500;
}
.lang-toggle:hover{border-color:var(--gold);color:var(--ink)}
.lang-toggle .lang-opt{transition:color .25s;padding:0 2px}
.lang-toggle .lang-opt.on{color:var(--gold);font-weight:700}
.lang-toggle .lang-sep{opacity:.4}
html[lang="ar"] .lang-toggle .lang-opt,
html[lang="ar"] .lang-toggle .lang-sep{letter-spacing:0}

.access-link{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;
  border:1px solid var(--line-2);border-radius:100px;padding:9px 18px;transition:.25s var(--ease);
  background:var(--panel);
}
.access-link:hover{color:var(--gold);border-color:var(--gold);background:var(--secondary-soft)}

.burger{display:none;width:42px;height:36px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;cursor:pointer;position:relative;z-index:95;padding:0}
.burger span{display:block;height:1.5px;background:var(--ink);margin:5px 10px;border-radius:2px;transition:.35s var(--ease)}
.burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

.mobile-menu{
  position:fixed;inset:0;z-index:85;background:rgba(251,248,243,.98);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.mobile-menu.open{opacity:1;pointer-events:auto}
.mobile-menu a{
  font-family:var(--serif);font-size:32px;font-weight:500;
  color:var(--ink);padding:10px 0;opacity:.85;transition:.25s;
}
.mobile-menu a:hover{opacity:1;color:var(--gold)}
.mobile-menu .mobile-lang{margin-top:26px;display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:13px}
.mobile-menu .mobile-lang button{
  background:var(--panel);border:1px solid var(--line-2);color:var(--muted);border-radius:100px;
  padding:9px 20px;font-size:11px;letter-spacing:.1em;cursor:pointer;transition:.25s;font-weight:500;
}
.mobile-menu .mobile-lang button.on{color:#fff;border-color:var(--gold);background:var(--gold)}

/* ============================================================
   BUTTONS & SHARED
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 28px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--panel);color:var(--ink);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:.25s var(--ease);white-space:nowrap;
}
.btn:hover{border-color:var(--gold);color:var(--gold);background:var(--secondary-soft)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.primary:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#fff;box-shadow:0 12px 28px -14px rgba(194,87,30,.7)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--gold);padding-left:0;padding-right:0}
.btn.ghost:hover{color:var(--gold-soft);background:transparent;box-shadow:none}
.btn.sm{padding:8px 16px;font-size:10px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.eyebrow{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .eyebrow{font-size:13px;letter-spacing:0;font-weight:500}

h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.005em;line-height:1.1;margin:0;color:var(--ink)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{line-height:1.4;font-weight:700}
.display{font-family:var(--serif);font-weight:500}
.muted{color:var(--muted)}
.tiny{font-size:12.5px;letter-spacing:.01em}

main#view{position:relative;z-index:3}
.wrap{max-width:1300px;margin:0 auto;padding:0 40px}
.section{padding:110px 0;position:relative}
.section.tight{padding:70px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:48px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.9rem);max-width:18ch}
.sec-head p{color:var(--muted);max-width:42ch;margin:0;font-size:15px;line-height:1.7}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.07s}.reveal.d2{transition-delay:.14s}.reveal.d3{transition-delay:.21s}.reveal.d4{transition-delay:.28s}

/* HERO */
.hero{
  position:relative;padding:150px 0 90px;overflow:hidden;
  background:
    radial-gradient(760px 460px at 10% -6%, rgba(232,114,47,.11), transparent 62%),
    radial-gradient(680px 480px at 94% 16%, rgba(255,217,184,.6), transparent 66%);
}
.hero-grid{max-width:1300px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1.06fr .94fr;gap:64px;align-items:center}
.hero h1{font-size:clamp(2.7rem,5.8vw,5rem);font-weight:500;letter-spacing:.02em;margin:20px 0 0;line-height:1.02}
html[lang="ar"] .hero h1{line-height:1.25;letter-spacing:0;font-weight:700}
.hero .tagline{
  font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2vw,1.5rem);
  color:var(--muted);max-width:34ch;margin:22px 0 0;line-height:1.6;font-weight:400;
}
html[lang="ar"] .hero .tagline{font-style:normal;max-width:30ch;line-height:1.9}
.hero-actions{display:flex;gap:12px;margin-top:38px;flex-wrap:wrap}
.hero-copy > *{animation:heroIn .9s var(--ease) both}
.hero-copy > *:nth-child(2){animation-delay:.06s}
.hero-copy > *:nth-child(3){animation-delay:.12s}
.hero-copy > *:nth-child(4){animation-delay:.18s}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.hero-visual{position:relative;cursor:pointer;animation:heroIn 1s var(--ease) .1s both}
.hero-frame{position:relative;aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.hero-frame > div{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.hero-visual:hover .hero-frame > div{transform:scale(1.045)}
.hero-caption{
  position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;
}
.hero-caption .chip{margin:0;flex:0 0 auto}
.hero-caption-title{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-caption-arrow{color:var(--gold);transition:transform .3s var(--ease)}
.hero-visual:hover .hero-caption-arrow{transform:translateX(3px)}
html[dir="rtl"] .hero-visual:hover .hero-caption-arrow{transform:translateX(-3px)}

.intro-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:70px;align-items:center}
.intro-copy p{font-size:16.5px;line-height:1.9;color:var(--ink-2);margin:0 0 20px;max-width:54ch}
html[lang="ar"] .intro-copy p{line-height:2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 26px;transition:.25s var(--ease);box-shadow:var(--shadow-sm)}
.stat:hover{border-color:rgba(194,87,30,.28);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:40px;font-weight:600;color:var(--gold);line-height:1}
.stat span{display:block;margin-top:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
html[lang="ar"] .stat span{letter-spacing:0;font-size:12px}

.featured{display:grid;grid-template-columns:1.04fr .96fr;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:.35s var(--ease);box-shadow:var(--shadow-sm)}
.featured:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:rgba(194,87,30,.25)}
.featured-art{position:relative;min-height:340px;overflow:hidden}
.featured-art > div{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.featured:hover .featured-art > div{transform:scale(1.05)}
.featured-body{padding:52px;display:flex;flex-direction:column;justify-content:center}
.featured-body h3{font-size:clamp(2rem,3.6vw,3rem);margin:14px 0 16px}
.featured-body p{color:var(--muted);font-size:15.5px;line-height:1.8;margin:0 0 28px;max-width:42ch}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border:1px solid var(--line-2);padding:6px 13px;border-radius:100px;background:var(--panel)}
html[lang="ar"] .chip{font-size:11.5px;letter-spacing:0;font-weight:500}
.chip.gold{color:var(--gold);border-color:rgba(194,87,30,.3);background:var(--secondary-soft)}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid-1{display:grid;grid-template-columns:1fr;gap:22px}

.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:.3s var(--ease);box-shadow:var(--shadow-sm)}
.gcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(194,87,30,.25)}
.gcard-art{position:relative;aspect-ratio:4/3;overflow:hidden}
.gcard-art > div{position:absolute;inset:0;transition:transform 1s var(--ease)}
.gcard:hover .gcard-art > div{transform:scale(1.05)}
.gcard-status{position:absolute;top:14px;left:14px;z-index:3;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:6px 12px;border-radius:100px;color:var(--ink);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line)}
html[dir="rtl"] .gcard-status{left:auto;right:14px}
html[lang="ar"] .gcard-status{font-size:11px;letter-spacing:0;font-weight:500}
.gcard-status.dev{color:var(--gold);border-color:rgba(194,87,30,.3)}
.gcard-body{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px}
.gcard-body h3{font-size:21px;margin:0 0 3px;font-weight:600}
.gcard-body p{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .gcard-body p{letter-spacing:0;font-size:12.5px}
.gcard-arrow{color:var(--muted-2);transition:.3s var(--ease);flex:0 0 auto;font-size:16px}
.gcard:hover .gcard-arrow{color:var(--gold);transform:translateX(4px)}
html[dir="rtl"] .gcard:hover .gcard-arrow{transform:translateX(-4px)}

.tcard{cursor:pointer}
.tcard-frame{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-sm);transition:.3s var(--ease)}
.tcard:hover .tcard-frame{box-shadow:var(--shadow);border-color:rgba(194,87,30,.25)}
.tcard-frame > div.bg{position:absolute;inset:0;transition:transform 1s var(--ease)}
.tcard:hover .tcard-frame > div.bg{transform:scale(1.04)}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;z-index:3;transition:.3s var(--ease);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--shadow-sm)}
.play::before{content:'';width:0;height:0;border-left:12px solid var(--ink);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px;transition:.3s}
html[dir="rtl"] .play::before{margin-left:0;margin-right:4px;border-left:0;border-right:12px solid var(--ink)}
.tcard:hover .play{background:var(--gold);border-color:var(--gold);transform:scale(1.06)}
.tcard:hover .play::before{border-left-color:#fff;border-right-color:#fff}
.tcard-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:14px}
.tcard-meta h4{font-size:18px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard-meta span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap;font-weight:500}
html[lang="ar"] .tcard-meta span{letter-spacing:0}

.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:120px 1fr 30px;gap:28px;align-items:center;padding:26px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.25s var(--ease);border-radius:var(--r);margin:0 -18px}
.nrow:first-child{border-top:1px solid var(--line)}
.nrow:hover{background:var(--panel);box-shadow:var(--shadow-sm)}
.nrow time{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:500}
html[lang="ar"] .nrow time{letter-spacing:0}
.nrow h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px;transition:color .25s;line-height:1.25}
.nrow:hover h4{color:var(--gold)}
.nrow p{margin:0;font-size:14px;color:var(--muted);max-width:68ch;line-height:1.65}
.nrow .go{color:var(--muted-2);transition:.25s;justify-self:end}
.nrow:hover .go{color:var(--gold);transform:translateX(3px)}
html[dir="rtl"] .nrow:hover .go{transform:translateX(-3px)}

.timeline{position:relative;padding-left:28px;border-left:1px solid var(--line)}
html[dir="rtl"] .timeline{padding-left:0;padding-right:28px;border-left:0;border-right:1px solid var(--line)}
.tl-item{position:relative;padding:0 0 34px 0}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-33.5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--gold-dim)}
html[dir="rtl"] .tl-item::before{left:auto;right:-33.5px}
.tl-item time{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .tl-item time{letter-spacing:0}
.tl-item h4{font-size:20px;font-weight:600;margin:8px 0 6px}
.tl-item p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}

.tcard-person{text-align:center}
.person-art{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line);margin-bottom:16px;transition:.3s var(--ease);box-shadow:var(--shadow-sm)}
.tcard-person:hover .person-art{box-shadow:var(--shadow);border-color:rgba(194,87,30,.25)}
.person-art > div{position:absolute;inset:0;transition:transform 1s var(--ease)}
.tcard-person:hover .person-art > div{transform:scale(1.04)}
.tcard-person h4{font-size:20px;font-weight:600;margin:0 0 3px}
.tcard-person .role{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .tcard-person .role{letter-spacing:0;font-size:12px}
.tcard-person .bio{font-size:13.5px;color:var(--muted);margin:10px 0 0;line-height:1.65}

.page-head{padding:170px 0 64px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:

/* ---------------------------------------------------------------------------
   2. CREDENTIAL VAULT
   The password is never written as a literal. It is reconstructed at runtime
   from two numeric fragments. Comparison is constant-time to avoid timing leaks.
   If an admin sets a custom password, it is stored only as a salted SHA-256 hash.

  const _a = [71, 42, 44, 92, 38, 47, 34, 40, 27, 46, 36, 43, 32];
  const _b = [7, 13, 21, 5, 11, 3, 17, 9, 23, 5, 13, 7, 19];

  function safeEqual(a, b) {

/* ---------------------------------------------------------------------------
   3. LOGIN THROTTLE
   5 attempts, then escalating lockouts (5m → 10m → 20m → 40m → 1h cap).
   --------------------------------------------------------------------------- */
const THROTTLE_KEY = 'n7.throttle';
const MAX_FREE_ATTEMPTS = 5;

function readThrottle() {
  try {
    const raw = localStorage.getItem(THROTTLE_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if (o && typeof o.n === 'number' && typeof o.until === 'number') return o;
  } catch (e) {}
  return { n: 0, until: 0 };
}
function writeThrottle(o) {
  try { localStorage.setItem(THROTTLE_KEY, JSON.stringify(o)); } catch (e) {}
}
function lockRemaining() {
  const o = readThrottle();
  return Math.max(0, (o.until || 0) - Date.now());
}
function registerFailure() {
  const o = readThrottle();
  o.n = (o.n || 0) + 1;
  if (o.n >= MAX_FREE_ATTEMPTS) {
    const over = o.n - MAX_FREE_ATTEMPTS;
    const minutes = Math.min(60, 5 * Math.pow(2, over));
    o.until = Date.now() + minutes * 60 * 1000;
  }
  writeThrottle(o);
  return o;
}
function clearThrottle() {
  try { localStorage.removeItem(THROTTLE_KEY); } catch (e) {}
}
function attemptsLeft() {
  const o = readThrottle();
  return Math.max(0, MAX_FREE_ATTEMPTS - (o.n || 0));
}

/* ---------------------------------------------------------------------------
   4. SESSIONS
   8-hour hard expiry, 30-minute idle expiry, random token.
   --------------------------------------------------------------------------- */
const SESSION_KEY = 'n7.session';
const SESSION_TTL = 8 * 60 * 60 * 1000;
const IDLE_TTL = 30 * 60 * 1000;

function newToken() {
  if (window.crypto && crypto.getRandomValues) {
    return Array.from(crypto.getRandomValues(new Uint8Array(24)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return String(Date.now()) + Math.random().toString(36).slice(2);
}
function openSession() {
  const now = Date.now();
  const payload = { t: newToken(), at: now, seen: now, exp: now + SESSION_TTL };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(payload)); } catch (e) {}
}
function readSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s.exp !== 'number') return null;
    return s;
  } catch (e) { return null; }
}
function touchSession() {
  const s = readSession();
  if (!s) return;
  s.seen = Date.now();
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
}
function closeSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function isAuthed() {
  const s = readSession();
  if (!s) return false;
  const now = Date.now();
  if (now > s.exp) { closeSession(); return false; }
  if (now - (s.seen || s.at) > IDLE_TTL) { closeSession(); return false; }
  return true;
}

   5. DATA INTEGRITY
   Stored payload is signed with a rolling checksum. If localStorage is edited
   by hand, the mismatch is detected and the content is reset to the seed.
   --------------------------------------------------------------------------- */
const DB_KEY = 'n7.studio.v1';
const DB_VERSION = 3;
let db = null;
let integrityWarning = false;

function checksum(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16) + ':' + str.length.toString(16);
}

/* ---------------------------------------------------------------------------
   9. LOAD / SAVE
   --------------------------------------------------------------------------- */
function persist() {
  try {
    const json = JSON.stringify(db);
    const payload = JSON.stringify({ v: DB_VERSION, d: json, s: checksum(json) });
    localStorage.setItem(DB_KEY, payload);
  } catch (e) {
    /* Quota exceeded — keep running in memory */
  }
}

function loadDB() {
  let loaded = null;
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const outer = JSON.parse(raw);
      if (outer && outer.v === DB_VERSION && typeof outer.d === 'string') {
        if (checksum(outer.d) === outer.s) {
          loaded = JSON.parse(outer.d);
        } else {
          integrityWarning = true;   /* tampered payload — discard */
        }
      } else if (outer && outer.settings && outer.games) {
        loaded = outer;              /* legacy format */
      }
    }
  } catch (e) {
    integrityWarning = true;
  }

  const base = clone(SEED);
  if (loaded) {
    base.settings = Object.assign(base.settings, loaded.settings || {});
    ['games', 'trailers', 'news', 'updates', 'team'].forEach(k => {
      if (Array.isArray(loaded[k])) base[k] = loaded[k];
    });
  }

  /* Purge any legacy plaintext credential */
  delete base.settings.password;

  db = base;
  persist();
}

/* ---------------------------------------------------------------------------
   10. TOAST / MODAL
   --------------------------------------------------------------------------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
let modalKeyHandler = null;
function showModal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-backdrop" data-close="1"></div>${html}`;
  m.hidden = false;
  requestAnimationFrame(() => m.classList.add('open'));
  document.body.style.overflow = 'hidden';
  modalKeyHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', modalKeyHandler);
  m.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
}
function closeModal() {
  const m = $('#modal');
  m.classList.remove('open');
  document.body.style.overflow = '';
  if (modalKeyHandler) { document.removeEventListener('keydown', modalKeyHandler); modalKeyHandler = null; }
  setTimeout(() => { m.hidden = true; m.innerHTML = ''; }, 340);
}

/* ---------------------------------------------------------------------------
   11. ROUTER (with navigation flood guard)
   --------------------------------------------------------------------------- */
const view = $('#view');
const footer = $('#footer');
const navLinks = $('#navLinks');

function navItems() {
  return [
    { label: t('nav_home'), href: '#/' },
    { label: t('nav_games'), href: '#/games' },
    { label: t('nav_news'), href: '#/news' },
    { label: t('nav_team'), href: '#/team' },
    { label: t('nav_studio'), href: '#/about' }
  ];
}

let gameFilter = 'All';
let lastRouteAt = 0;
let routeBurst = 0;

function route(force) {
  /* Guard against scripted hash-spam loops */
  const now = Date.now();
  if (!force) {
    if (now - lastRouteAt < 25) {
      routeBurst++;
      if (routeBurst > 12) return;   /* clearly a loop, drop it */
    } else {
      routeBurst = 0;
    }
    lastRouteAt = now;
  }

  const raw = location.hash.replace(/^#/, '') || '/';
  const parts = raw.split('/').filter(Boolean);
  closeMobileMenu();

  if (parts[0] === 'admin') {
    document.querySelector('meta[name="robots"]')?.remove();
    const m = document.createElement('meta');
    m.name = 'robots'; m.content = 'noindex, nofollow';
    document.head.appendChild(m);
    renderAdmin(parts.slice(1));
  } else {
    document.querySelector('meta[name="robots"]')?.remove();
    renderPublic(parts);
  }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function renderPublic(parts) {
  document.body.classList.remove('mode-admin');
  document.body.classList.add('mode-public');
  $('#nav').style.display = '';
  footer.style.display = '';

  const items = navItems();
  navLinks.innerHTML = items.map(i => {
    const active = (i.href === '#/' && !parts.length) || (i.href !== '#/' && parts[0] && i.href.endsWith(parts[0]));
    return `<a href="${i.href}" class="${active ? 'active' : ''}">${esc(i.label)}</a>`;
  }).join('');

  $('#mobileMenu').innerHTML = items.map(i => `<a href="${i.href}">${esc(i.label)}</a>`).join('') +
    `<a href="#/admin" style="font-size:15px;letter-spacing:.14em;color:var(--muted);margin-top:14px;font-family:var(--sans);text-transform:uppercase;font-weight:500">${esc(t('nav_access'))}</a>
     <div class="mobile-lang">
       <button id="mmLangEn" data-act="set-lang" data-lang="en" class="${lang === 'en' ? 'on' : ''}">EN</button>
       <button id="mmLangAr" data-act="set-lang" data-lang="ar" class="${lang === 'ar' ? 'on' : ''}">العربية</button>
     </div>`;

  $('#brandWord').innerHTML = `${esc(db.settings.studio)}<small data-i18n="brand_sub">${esc(t('brand_sub'))}</small>`;
  document.title = `${db.settings.studio} — ${lang === 'ar' ? 'استوديو ألعاب مستقل' : 'Independent Game Studio'}`;

  const page = parts[0] || 'home';
  let html = '';
  if (page === 'home') html = viewHome();
  else if (page === 'games') html = parts[1] ? viewGameDetail(parts[1]) : viewGames();
  else if (page === 'news') html = parts[1] ? viewNewsDetail(parts[1]) : viewNews();
  else if (page === 'team') html = viewTeam();
  else if (page === 'about') html = viewAbout();
  else html = view404();

  view.innerHTML = html;
  footer.innerHTML = footerHTML();
  applyLang();
  afterRender();
}

function embedUrl(url) {
  const u = safeUrl(url, []);
  if (!u) return null;
  const yt = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,})/);
  if (yt) return { type: 'iframe', url: `https://www.youtube-nocookie.com/embed/${yt[1]}?autoplay=1&rel=0` };
  const vm = u.match(/vimeo\.com\/(\d+)/);
  if (vm) return { type: 'iframe', url: `https://player.vimeo.com/video/${vm[1]}?autoplay=1` };
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(u)) return { type: 'video', url: u };
  return { type: 'iframe', url: u };
}
function openTrailer(id) {
  const tr = db.trailers.find(x => x.id === id);
  if (!tr) { toast('Trailer not found'); return; }
  const src = embedUrl(tr.video);
  const body = src
    ? (src.type === 'video'
      ? `<video src="${esc(src.url)}" controls autoplay playsinline></video>`
      : `<iframe src="${esc(src.url)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`)
    : `<div class="slate">
         <div>
           <div class="eyebrow">${esc(t('trailer_official'))}</div>
           <h3>${esc(tr.title)}</h3>
           <p class="muted" style="margin:0;font-size:13px">${esc(tr.description || t('trailer_soon'))}</p>
         </div>
       </div>`;
  showModal(`
    <div class="modal-box wide">
      <div class="modal-head">
        <h3>${esc(tr.title)}</h3>
        <button class="x" data-close="1" aria-label="Close">✕</button>
      </div>
      <div class="video-frame">${body}</div>
      <div class="modal-body" style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <span class="muted tiny">${esc(tr.game || '')}</span>
        <span class="muted tiny">${esc(fmtDate(tr.date))}</span>
      </div>
    </div>`);
}

      <main class="admin-main">
        <div class="adm-topbar">
          <span><span class="dot"></span>Secure session · expires in ${Math.floor(sessionLeft / 3600000)}h ${Math.floor((sessionLeft % 3600000) / 60000)}m</span>

function loginView() {
  const ms = lockRemaining();
  const locked = ms > 0;
  const mins = Math.ceil(ms / 60000);
  const left = attemptsLeft();

  return `
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="off" novalidate>
      <div class="login-lock">⛨</div>
      <div class="eyebrow">Restricted Area</div>
      <h1 class="display" style="font-size:2.3rem;margin:14px 0 6px">Studio Dashboard</h1>
      <p class="muted" style="margin:0 0 26px;font-size:13.5px">Authorized team members only. All access attempts are logged.</p>

      <div class="field">
        <label class="fl" for="pw">Password</label>
        <input class="inp" type="password" id="pw" placeholder="••••••••••••" autocomplete="current-password"
          ${locked ? 'disabled' : ''} maxlength="128">
      </div>

      <!-- Honeypot: invisible to humans, irresistible to bots -->
      <div class="hp" aria-hidden="true">
        <label>Leave this empty
          <input type="text" id="hp_field" tabindex="-1" autocomplete="off">
        </label>
      </div>

      <div class="err" id="loginErr">${locked ? `Locked out. Try again in about ${mins} minute${mins === 1 ? '' : 's'}.` : ''}</div>

      <button class="btn primary" type="submit" style="width:100%;margin-top:4px" ${locked ? 'disabled' : ''}>
        ${locked ? 'Locked' : 'Enter Studio'}
      </button>

      ${!locked && left < MAX_FREE_ATTEMPTS ? `<p class="err" style="text-align:center;margin-top:10px">${left} attempt${left === 1 ? '' : 's'} remaining before lockout.</p>` : ''}

      <div class="sec-note">
        This dashboard is protected by attempt throttling, session expiry and integrity checks.
        If you are not authorized, close this page.
      </div>

      <p style="text-align:center;margin:16px 0 0"><a href="#/" style="color:var(--muted-2);font-size:12px">← Back to the site</a></p>
    </form>
  </div>`;
}

function bindLogin() {
  const form = $('#loginForm');
  if (!form) return;

  const locked = lockRemaining() > 0;
  if (locked) {
    setTimeout(route, 20000);  /* re-render when the lock window may have passed */
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (lockRemaining() > 0) return;

    const errEl = $('#loginErr');
    const btn = form.querySelector('button[type="submit"]');
    const input = $('#pw');
    const honey = $('#hp_field');

    /* Bot trap */
    if (honey && honey.value.trim() !== '') {
      registerFailure(); registerFailure(); registerFailure();
      errEl.textContent = 'Access denied.';
      return;
    }

    const value = input.value;
    if (!value) { errEl.textContent = 'Enter your password.'; return; }

    btn.disabled = true;
    btn.textContent = 'Verifying…';
    errEl.textContent = '';

    /* Small fixed delay — costs a human nothing, costs a script a lot */
    await new Promise(r => setTimeout(r, 450));

    const ok = await VAULT.verify(value);

    if (ok) {
      clearThrottle();
      openSession();
      input.value = '';
      toast('Welcome back');
      route(true);
    } else {
      const state = registerFailure();
      const remaining = lockRemaining();

      if (remaining > 0) {
        input.value = '';
        input.disabled = true;
        btn.disabled = true;
        btn.textContent = 'Locked';
        const mins = Math.ceil(remaining / 60000);
        errEl.textContent = `Too many attempts. Locked for about ${mins} minute${mins === 1 ? '' : 's'}.`;
        setTimeout(route, remaining + 500);
      } else {
        const left = MAX_FREE_ATTEMPTS - (state.n || 0);
        input.value = '';
        input.focus();
        btn.disabled = false;
        btn.textContent = 'Enter Studio';
        errEl.textContent = `Incorrect password. ${left} attempt${left === 1 ? '' : 's'} remaining.`;
      }
    }
  });

  setTimeout(() => { const p = $('#pw'); if (p && !p.disabled) p.focus(); }, 150);
}

function adminSecurity() {
  const th = readThrottle();
  const sess = readSession();
  const left = sess ? Math.max(0, sess.exp - Date.now()) : 0;
  const idleLeft = sess ? Math.max(0, IDLE_TTL - (Date.now() - (sess.seen || sess.at))) : 0;
  const hh = Math.floor(left / 3600000), mm = Math.floor((left % 3600000) / 60000);
  const im = Math.floor(idleLeft / 60000);

  return `
  <div class="adm-head">
    <div>
      <h1>Security</h1>
      <p>Session state, login throttling and credential management.</p>
    </div>
  </div>

  <div class="sec-grid">
    <div class="sec-tile">
      <div class="k">Session Expires In</div>
      <div class="v">${hh}h ${mm}m</div>
    </div>
    <div class="sec-tile">
      <div class="k">Idle Timeout</div>
      <div class="v">${im} min left</div>
    </div>
    <div class="sec-tile">
      <div class="k">Failed Attempts Recorded</div>
      <div class="v">${th.n || 0}</div>
    </div>
    <div class="sec-tile">
      <div class="k">Credential Source</div>
      <div class="v small">${VAULT.isDefault() ? 'Built-in studio key' : 'Custom (salted SHA-256)'}</div>
    </div>
  </div>

  <div class="panel panel-pad" style="margin-bottom:18px">
    <h3 style="font-size:18px;font-family:var(--sans);font-weight:600;margin-bottom:14px">Change Password</h3>
    <p class="muted" style="font-size:13px;margin:0 0 18px">
      New passwords are stored only as a salted SHA-256 hash. Leave both fields blank to keep the current password.
    </p>
    <form id="pwForm" style="max-width:480px">
      <div class="field">
        <label class="fl" for="pw-new">New password</label>
        <input class="inp" type="password" id="pw-new" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters">
      </div>
      <div class="field">
        <label class="fl" for="pw-confirm">Confirm new password</label>
        <input class="inp" type="password" id="pw-confirm" autocomplete="new-password" minlength="12" maxlength="128">
      </div>
      <div class="err" id="pwErr"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button class="btn primary" type="submit">Update Password</button>
        <button class="btn" type="button" data-act="restore-default-pw">Restore Built-in Key</button>
      </div>
    </form>
  </div>

  <div class="panel panel-pad">
    <h3 style="font-size:18px;font-family:var(--sans);font-weight:600;margin-bottom:14px">Login Throttle</h3>
    <p class="muted" style="font-size:13px;margin:0 0 16px">
      After ${MAX_FREE_ATTEMPTS} failed attempts the login is locked with escalating delays, up to 60 minutes.
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" data-act="clear-throttle">Clear Lockout &amp; Attempt Count</button>
      <button class="btn" data-act="logout-all">End This Session</button>
    </div>
    <div class="warnbox" style="margin-top:18px">
      <strong>Reality check:</strong> this dashboard runs entirely in the browser. Throttling, hashing and
      session expiry make casual intrusion impractical, but a determined attacker who controls the client
      can bypass any of it. For production, move authentication and rate limiting to a server or an
      edge provider — see the notes at the bottom of the source file.
    </div>
  </div>`;
}

function bindSecurityPanel() {
  const form = $('#pwForm');

    if (a.length < 12) { err.textContent = 'Use at least 12 characters.'; return; }
    if (a !== b) { err.textContent = 'The two passwords do not match.'; return; }

    const ok = await VAULT.setPassword(a);
    if (!ok) { err.textContent = 'Could not hash the password in this browser. Try a modern one.'; return; }

  });
}

function openEditor(key, id) {
  const sc = SCHEMAS[key];
  const isNew = !id;
  const existing = isNew ? {} : (db[key] || []).find(x => x.id === id);
  if (!isNew && !existing) { toast('Entry not found'); return; }
  const values = existing || {};

  const fieldHTML = (f) => {
    const val = values[f.k];
    const full = f.full ? ' full' : '';
    if (f.t === 'bool') {
      return `<div class="field${full}"><label class="check"><input type="checkbox" data-f="${f.k}" ${val ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
    }
    if (f.t === 'textarea' || f.t === 'lines') {
      const v = f.t === 'lines' ? (Array.isArray(val) ? val.join('\n') : '') : (val || '');
      return `<div class="field${full}"><label class="fl">${esc(f.l)}</label><textarea class="txa" data-f="${f.k}" ${f.max ? `maxlength="${f.max}"` : ''}>${esc(v)}</textarea></div>`;
    }
    if (f.t === 'select') {
      return `<div class="field${full}"><label class="fl">${esc(f.l)}</label><select class="sel" data-f="${f.k}">
        ${(f.o || []).map(o => `<option ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    }
    if (f.t === 'list') {
      const v = Array.isArray(val) ? val.join(', ') : (val || '');
      return `<div class="field${full}"><label class="fl">${esc(f.l)}</label><input class="inp" data-f="${f.k}" value="${esc(v)}" maxlength="300"></div>`;
    }
    return `<div class="field${full}"><label class="fl">${esc(f.l)}</label><input class="inp" type="${f.t === 'date' ? 'date' : 'text'}" data-f="${f.k}" value="${esc(val || '')}" ${f.max ? `maxlength="${f.max}"` : ''}></div>`;
  };

  showModal(`
    <div class="modal-box">
      <div class="modal-head">
        <h3>${isNew ? 'New' : 'Edit'} ${esc(sc.singular)}</h3>
        <button class="x" data-close="1" aria-label="Close">✕</button>
      </div>
      <form class="modal-body" id="entityForm">
        <div class="form-grid">${sc.fields.map(fieldHTML).join('')}</div>
        <div class="err" id="entityErr"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:10px">
          <button type="button" class="btn" data-close="1">Cancel</button>
          <button type="submit" class="btn primary">${isNew ? 'Create' : 'Save'}</button>
        </div>
      </form>
    </div>`);

  const form = $('#entityForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const out = {};
    let valid = true;
    let urlProblem = false;

    sc.fields.forEach(f => {
      const el = form.querySelector(`[data-f="${f.k}"]`);
      if (!el) return;

      if (f.t === 'bool') {
        out[f.k] = el.checked;
      } else if (f.t === 'list') {
        out[f.k] = el.value.split(',').map(s => cap(s, 60).trim()).filter(Boolean).slice(0, 12);
      } else if (f.t === 'lines') {
        out[f.k] = el.value.split('\n').map(s => cap(s, 300).trim()).filter(Boolean).slice(0, 20);
      } else {
        let v = el.value.trim();
        if (f.max) v = cap(v, f.max);
        if (f.url !== undefined) {
          const cleaned = safeUrl(v, f.url === 'img' ? ['img'] : []);
          if (v && !cleaned) { urlProblem = true; }
          v = cleaned;
        }
        out[f.k] = v;
      }
      if (f.req && !out[f.k]) valid = false;
    });

    if (urlProblem) {
      $('#entityErr').textContent = 'An image or video URL is not allowed. Use https:// links only.';
      return;
    }
    if (!valid) {
      $('#entityErr').textContent = 'Please fill in all required fields.';
      return;
    }

    if (isNew) {
      out.id = uid(key.substring(0, 2));
      db[key] = db[key] || [];
      db[key].unshift(out);
      if (key === 'games' && out.featured) db.games.forEach(g => { if (g.id !== out.id) g.featured = false; });
    } else {
      const idx = db[key].findIndex(x => x.id === id);
      db[key][idx] = Object.assign({}, db[key][idx], out);
      if (key === 'games' && out.featured) db.games.forEach(g => { if (g.id !== id) g.featured = false; });
    }
    persist();
    closeModal();
    toast(isNew ? `${sc.singular} created` : `${sc.singular} updated`);
    route(true);
  });
}

function handleAction(act, el) {
  const id = el.dataset.id;
  const key = el.dataset.key;

  switch (act) {
    case 'go': location.hash = el.dataset.href; break;
    case 'watch-trailer': if (id) openTrailer(id); else toast('No trailer available yet'); break;
    case 'filter': gameFilter = el.dataset.filter; renderPublic(['games']); break;
    case 'toggle-lang': setLang(lang === 'en' ? 'ar' : 'en'); break;
    case 'set-lang': setLang(el.dataset.lang); break;

    case 'logout':
      closeSession();
      toast('Signed out');
      location.hash = '#/admin';
      route(true);
      break;

    case 'logout-all':
      closeSession();
      toast('Session ended');
      location.hash = '#/admin';
      route(true);
      break;

    case 'clear-throttle':
      clearThrottle();
      toast('Lockout cleared');
      route(true);
      break;

    case 'restore-default-pw':
      if (confirm('Restore the built-in studio key? Any custom password will stop working.')) {
        VAULT.restoreDefault();
        toast('Built-in key restored');
        route(true);
      }
      break;

    case 'new-entity': openEditor(key, null); break;
    case 'edit-entity': openEditor(key, id); break;

    case 'del-entity': {
      const sc = SCHEMAS[key];
      const item = (db[key] || []).find(x => x.id === id);
      if (!item) return;
      const label = item.title || item.name || 'this entry';
      if (confirm(`Delete “${label}”? This cannot be undone.`)) {
        db[key] = db[key].filter(x => x.id !== id);
        persist();
        toast(`${sc.singular} deleted`);
        route(true);
      }
      break;
    }
  }
}

document.addEventListener('click', (e) => {

/* ---------------------------------------------------------------------------
   19. REVEALS / SCROLL / IDLE
   --------------------------------------------------------------------------- */
function afterRender() {
  initReveals();
  updateNavState();
}
let revealObserver = null;
function initReveals() {
  if (revealObserver) revealObserver.disconnect();
  const els = $$('.reveal');
  if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); revealObserver.unobserve(en.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => revealObserver.observe(el));
}
function updateNavState() {
  const nav = $('#nav');
  if (!nav) return;
  nav.classList.toggle('solid', window.scrollY > 30);
}
window.addEventListener('scroll', updateNavState, { passive: true });

const burger = $('#burger');
const mobileMenu = $('#mobileMenu');
function closeMobileMenu() {
  if (!burger) return;
  burger.classList.remove('open');
  burger.setAttribute('aria-expanded', 'false');
  mobileMenu.classList.remove('open');
  document.body.style.overflow = '';
}
burger.addEventListener('click', () => {
  const open = !burger.classList.contains('open');
  burger.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', String(open));
  mobileMenu.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
});
mobileMenu.addEventListener('click', (e) => { if (e.target.tagName === 'A') closeMobileMenu(); });

/* Keep the session warm while the admin is genuinely being used */
['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (document.body.classList.contains('mode-admin') && isAuthed()) touchSession();
  }, { passive: true });
});

/* Idle watchdog — drops an unattended admin session */
setInterval(() => {
  if (document.body.classList.contains('mode-admin')) {
    if (sessionStorage.getItem(SESSION_KEY) && !isAuthed()) {
      toast('Session expired — please sign in again');
      route(true);
    }
  }
}, 60000);

/* ---------------------------------------------------------------------------
   20. BOOT
   --------------------------------------------------------------------------- */
loadDB();
applyLang();
window.addEventListener('hashchange', route);
route(true);

if (integrityWarning) {
  setTimeout(() => toast('Stored content failed its integrity check and was reset.'), 700);
}
</script>

============================================================================
  SECURITY — WHAT IS (AND ISN'T) POSSIBLE HERE
============================================================================

WHAT THIS FILE DOES
  • The password never appears as text in the source. It is reconstructed at
    runtime from two numeric fragments, and compared in constant time.
  • If you change the password in Security, only a salted SHA-256 hash is
    stored — never the plaintext.
  • Five wrong attempts trigger escalating lockouts: 5m → 10m → 20m → 40m → 1h.
  • Sessions expire after 8 hours, and after 30 minutes of inactivity.
  • Every content payload is signed with a checksum. Editing localStorage by
    hand invalidates the signature and the site resets to its seed content.
  • A Content-Security-Policy blocks external scripts, inline frames from
    unknown hosts, plugins and base-tag hijacking.
  • All user-supplied URLs are allow-listed (http/https, or data:image only
    for images). javascript: and vbscript: are rejected everywhere.
  • Every rendered value is HTML-escaped. A honeypot field catches naive bots.
  • Clickjacking is blocked with a frame-buster plus frame-ancestors 'none'.
  • All outbound links use rel="noopener noreferrer".

WHAT THIS FILE CANNOT DO
  • Stop a real DDoS. That is a network-layer attack against a host. A static
    page has no host to flood until you deploy it somewhere — and then the
    protection is the CDN's job, not the page's.
  • Protect secrets. Anything shipped to the browser is ultimately readable by
    the person running that browser. Client-side auth is a door lock, not a
    vault. It stops colleagues and casual visitors, not a determined attacker
    with devtools.
  • Enforce rate limits that a scripted client respects. Local lockout is
    stored in the browser — clearing storage clears the lockout.

RECOMMENDED PRODUCTION SETUP
  1. Put the site behind Cloudflare (free tier is enough to start):
     • "Under Attack Mode" during an active flood
     • Rate limiting rules on /admin and any API route
     • WAF managed rules
     • Bot Fight Mode
  2. Move authentication to a serverless function (Cloudflare Workers,
     Vercel Edge, Netlify Functions). Validate the password there, issue an
     HttpOnly, Secure, SameSite=Strict session cookie.
  3. Serve the admin dashboard only after that cookie is validated. Never
     ship the admin bundle to anonymous visitors.
  4. Store content in a real database (Supabase, Neon, D1) behind an
     authenticated API — not in localStorage.
  5. Add server-side rate limiting on login (per IP and per account), and
     log every failed attempt.
  6. Turn on HTTPS-only (HSTS) and set real security headers at the CDN:
     Strict-Transport-Security, X-Content-Type-Options, Permissions-Policy.

SHORT VERSION
  This build is hardened for a static site and will stop anyone who is not
  determined. If the studio ever handles real money, real user data, or
  attracts real attackers, it needs a backend. There is no way around that.
